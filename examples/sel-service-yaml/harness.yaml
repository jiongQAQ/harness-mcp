version: 1
spec_dir: harness
charter_dir: harness/_charter

verify:
  cmd: "echo 'fake mvn output'"
  workdir: "."
  filter_pattern: '-Dcucumber.filter.name="{capability}"'
  report:
    format: cucumber-json
    path: target/cucumber.json

ai_hints: |
  - 改任何业务代码前先调 context
  - 改实现前先 update_spec(软性提醒,不强制)
  - 改完调 verify 验证
